<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded squircle for crystal-clear contrast in Google Search light & dark mode -->
  <rect width="512" height="512" rx="120" fill="url(#nchGrad)" />

  <!-- Gear & Wrench emblem in high-contrast crisp white -->
  <g fill="#ffffff" filter="url(#subtleShadow)" transform="translate(4, 0)">
    <!-- 8-tooth gear -->
    <path d="M256,120 C246,120 238,126 235,135 L227,159 C215,164 204,171 194,180 L170,172 C161,169 151,173 146,181 L126,216 C121,224 123,235 130,241 L149,256 C149,263 149,269 150,276 L131,291 C124,297 122,308 127,316 L147,351 C152,359 162,363 171,360 L195,352 C205,361 216,368 228,373 L236,397 C239,406 247,412 257,412 L297,412 C307,412 315,406 318,397 L326,373 C338,368 349,361 359,352 L383,360 C392,363 402,359 407,351 L427,316 C432,308 430,297 423,291 L404,276 C405,269 405,263 405,256 L424,241 C431,235 433,224 428,216 L408,181 C403,173 393,169 384,172 L360,180 C350,171 339,164 327,159 L319,135 C316,126 308,120 298,120 Z" />

    <!-- Center cut-out circle (drawn with background color for hollow gear) -->
    <circle cx="277" cy="266" r="62" fill="url(#nchGrad)" />

    <!-- Angled mechanic wrench positioned inside the gear, angled 45 degrees -->
    <g transform="translate(277, 266) rotate(-45) translate(-277, -266)">
      <!-- Wrench head -->
      <path d="M245,170 C225,185 220,215 235,238 C242,248 252,256 264,260 L248,340 C246,350 252,360 262,363 L292,363 C302,360 308,350 306,340 L290,260 C302,256 312,248 319,238 C334,215 329,185 309,170 C298,162 284,158 270,162 C262,164 253,166 245,170 Z M277,215 C270,215 264,209 264,202 L264,185 C272,183 282,183 290,185 L290,202 C290,209 284,215 277,215 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
